[package]
default-run = "rustsorter"
edition = "2021"
name = "rustsorter"
version = "0.1.3"

[dependencies]
aide = { version = "0.15.0", features = [
    "axum",
    "axum-json",
    "axum-query",
    "macros",
    "swagger",
] }
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
bcrypt = "0.15.0"
chrono = { version = "^0", features = ["serde"] }
dotenv = "0.15.0"
elo = "0.3.0"
env_logger = { version = "0.11", features = ["kv"] }
futures-util = "0.3"
graph = "0.3.1"
graph_builder = "0.4.0"
log = { version = "0.4", features = ["kv", "kv_std"] }
rand = "0.8.5"
rayon = "=1.9.0"
schemars = { version = "0.9", features = ["uuid1", "chrono04"] }
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
slug = "0.1.5"
sprs = "0.11"
sqlx = { version = "0.8.2", features = [
    "chrono",
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "json",
] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1.88"
sea-query = "0.32.4"
ts-rs = { version = "11.0.1", features = ["chrono-impl", "uuid-impl", "serde-compat"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ranking"
harness = false

[profile.staging]
inherits = "dev"

[profile.release]
