name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Git user for tagging
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Determine New Tag
      - name: Determine New Tag
        id: new_tag
        run: |
          git fetch --tags
          # Get the latest tag or default to v0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Extract version numbers
          VERSION_MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | sed 's/v//')
          VERSION_MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          VERSION_PATCH=$(echo $LATEST_TAG | cut -d. -f3)

          # Increment patch version
          NEW_PATCH=$((VERSION_PATCH + 1))
          NEW_TAG="v${VERSION_MAJOR}.${VERSION_MINOR}.${NEW_PATCH}"
          echo "New tag: $NEW_TAG"

          # Set the new tag as output
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # Step 4: Create and Push Tag
      - name: Create and Push Tag
        run: |
          git tag ${{ steps.new_tag.outputs.tag }}
          git push origin ${{ steps.new_tag.outputs.tag }}

      # Step 5: Generate Release Notes
      - name: Generate Release Notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.sha }}^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            # No previous tag exists, include all commits
            NOTES=$(git log --pretty=format:'*- %s' ${{ github.sha }} )
          else
            NOTES=$(git log $PREVIOUS_TAG..${{ github.sha }} --pretty=format:'*- %s')
          fi
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

      # Step 6: Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.new_tag.outputs.tag }}
          release_name: "Release ${{ steps.new_tag.outputs.tag }}"
          body: "${{ steps.release_notes.outputs.notes }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Set up SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      # Step 8: Deploy to DigitalOcean via SSH
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: deployer
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Configure Git to use a personal access token for authentication
            git config --global url."https://${{ secrets.GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

            # If the sorter directory exists, remove it to ensure a fresh clone
            if [ -d "~/sorter" ]; then
              rm -rf ~/sorter
            fi

            # Clone the sorter monorepo from the production branch
            git clone -b production https://github.com/sorterisntonline/sorter.git ~/sorter

            # Navigate to the application directory
            cd ~/sorter || exit

            # Update Environment Variables
            # Write root .env
            cat <<EOF > .env
            DEPLOYMENT_ENV=${{ secrets.DEPLOYMENT_ENV }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            API_KEY=${{ secrets.API_KEY }}
            # ... add other root variables as needed ...
            EOF

            chmod 600 .env

            # Write forter/.env
            cat <<EOF > forter/.env
            # forter/.env

            # Linear Integration
            VITE_LINEAR_CLIENT_ID=${{ secrets.VITE_LINEAR_CLIENT_ID }}

            # Spotify Integration
            VITE_SPOTIFY_CLIENT_ID=${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

            # YouTube Integration
            VITE_YOUTUBE_CLIENT_ID=${{ secrets.VITE_YOUTUBE_CLIENT_ID }}
            EOF

            chmod 600 forter/.env

            # Write rustsorter/.env
            cat <<EOF > rustsorter/.env
            DEPLOYMENT_ENV=${{ secrets.DEPLOYMENT_ENV }}
            RUSTSORTER_DB_URL=${{ secrets.RUSTSORTER_DB_URL }}
            EOF

            chmod 600 rustsorter/.env

            # Execute the deployment script
            echo "Executing deploy.sh script..."
            bash scripts/deploy.sh

            exit 0