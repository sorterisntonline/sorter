name: Deploy to Environment

on:
  push:
    branches:
      - production
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'staging'
      build_borter:
        description: 'Build borter'
        required: true
        type: boolean
        default: true
      build_rustsorter:
        description: 'Build rustsorter'
        required: true
        type: boolean
        default: true

# Add concurrency group configuration
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true  # This will cancel any in-progress workflow and start the new one
  # Alternative: remove cancel-in-progress to queue instead of cancel

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    # Set environment-specific variables
    env:
      DEPLOY_ENV: ${{ (github.event_name == 'push' && github.ref_name == 'production') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && 'production' || 'development' }}
      BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.environment }}
      BUILD_MODE: ${{ (github.event_name == 'push' && github.ref_name == 'production') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && 'prod' || 'development' }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_WEBHOOK_URL: ${{ (github.ref_name == 'production' || inputs.environment == 'production') && vars.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK_URL_STAGING }}

    steps:
      # Add Discord notification step for build start
      - name: Notify Build Start
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          embed-title: "[CI/CD] build started"
          embed-url: ${{ env.WORKFLOW_URL }}
          embed-color: "3447003"
          embed-thumbnail-url: "https://img.icons8.com/external-smashingstocks-outline-color-smashing-stocks/66/external-rocket-space-smashingstocks-outline-color-smashing-stocks.png"
          embed-timestamp: ${{ github.event.head_commit.timestamp || '' }}
          embed-description: ${{ vars.DISCORD_WEBHOOK_PING_ROLEID && format('<@&{0}>', vars.DISCORD_WEBHOOK_PING_ROLEID) || '' }}
          embed-author-name: ${{ github.triggering_actor || github.actor }}
          embed-author-url: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          embed-author-icon-url: https://github.com/${{ github.triggering_actor || github.actor }}.png

      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.environment }}

      # Check rustsorter changes
      - name: Check rustsorter changes
        id: check_rust
        run: |
          # If this is a workflow dispatch, respect only the input setting
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.build_rustsorter }}" = "true" ]; then
              echo "skip_rust=false" >> $GITHUB_OUTPUT
            else
              echo "skip_rust=true" >> $GITHUB_OUTPUT
            fi
          else
            # Normal push-triggered behavior
            git fetch origin ${{ env.BRANCH }}
            echo "Checking for changes in rustsorter components..."
            PREVIOUS_COMMIT=$(git rev-parse origin/${{ env.BRANCH }}^)
            RUST_CHANGED=$(git diff --name-only $PREVIOUS_COMMIT HEAD | grep "^rustsorter/" || echo "")
            echo "Changes detected: $RUST_CHANGED"
            COMMIT_MSG=$(git log -1 --pretty=%B)
            
            if echo "$COMMIT_MSG" | grep -iE "(force-build-rust|forcebuild-rust)" > /dev/null; then
              echo "skip_rust=false" >> $GITHUB_OUTPUT
            elif echo "$COMMIT_MSG" | grep -iE "(skip.?rust|skiprust)" > /dev/null; then
              echo "skip_rust=true" >> $GITHUB_OUTPUT
            elif [ -z "$RUST_CHANGED" ]; then
              echo "skip_rust=true" >> $GITHUB_OUTPUT
            else
              echo "skip_rust=false" >> $GITHUB_OUTPUT
            fi
          fi

      # Check borter/forter/clisorter changes
      - name: Check borter changes
        id: check_bort
        run: |
          # If this is a workflow dispatch, respect only the input setting
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.build_borter }}" = "true" ]; then
              echo "skip_bort=false" >> $GITHUB_OUTPUT
            else
              echo "skip_bort=true" >> $GITHUB_OUTPUT
            fi
          else
            # Normal push-triggered behavior
            git fetch origin ${{ env.BRANCH }}
            echo "Checking for changes in borter components..."
            PREVIOUS_COMMIT=$(git rev-parse origin/${{ env.BRANCH }}^)
            BORT_CHANGED=$(git diff --name-only $PREVIOUS_COMMIT HEAD | grep -E "^(borter|forter|clisorter|public)/" || echo "")
            echo "Changes detected: $BORT_CHANGED"
            COMMIT_MSG=$(git log -1 --pretty=%B)
            
            if echo "$COMMIT_MSG" | grep -iE "(force-build-bort|forcebuild-bort)" > /dev/null; then
              echo "skip_bort=false" >> $GITHUB_OUTPUT
            elif echo "$COMMIT_MSG" | grep -iE "(skip.?bort|skipbort)" > /dev/null; then
              echo "skip_bort=true" >> $GITHUB_OUTPUT
            elif [ -z "$BORT_CHANGED" ]; then
              echo "skip_bort=true" >> $GITHUB_OUTPUT
            else
              echo "skip_bort=false" >> $GITHUB_OUTPUT
            fi
          fi

      # Step 2: Set up Git user for tagging
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Determine New Tag
      - name: Determine New Tag
        id: new_tag
        run: |
          git fetch --tags
          # Set prefix based on environment
          PREFIX="${{ github.ref_name == 'production' && 'prod' || 'staging' }}"
          
          # Get latest successful deploy number
          LATEST_TAG=$(git tag -l "${PREFIX}-*" | grep -v "F" | sort -V | tail -n1 || echo "${PREFIX}-0")
          echo "Latest tag: $LATEST_TAG"

          DEPLOY_NUM=$(echo $LATEST_TAG | sed "s/${PREFIX}-//")
          NEW_NUM=$((DEPLOY_NUM + 1))
          NEW_TAG="${PREFIX}-${NEW_NUM}"
          
          # Add appropriate suffix based on skip flags
          if [ "${{ steps.check_rust.outputs.skip_rust }}" == "true" ] && [ "${{ steps.check_bort.outputs.skip_bort }}" == "true" ]; then
            NEW_TAG="${NEW_TAG}-NOBUILD"
          else
            if [ "${{ steps.check_rust.outputs.skip_rust }}" == "true" ]; then
              NEW_TAG="${NEW_TAG}-sr"
            fi
            if [ "${{ steps.check_bort.outputs.skip_bort }}" == "true" ]; then
              NEW_TAG="${NEW_TAG}-sb"
            fi
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # Update SSH setup to use environment-specific deploy keys
      - name: Setup SSH for GitHub
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ (github.ref_name == 'production' || inputs.environment == 'production') && secrets.GH_DEPLOY_KEY_PROD || secrets.GH_DEPLOY_KEY }}

      # Step 4: Create and Push Tag
      - name: Create and Push Tag
        run: |
          git remote set-url origin git@github.com:sorterisntonline/sorter.git
          git tag ${{ steps.new_tag.outputs.tag }}
          git push origin ${{ steps.new_tag.outputs.tag }}

      # Add notification for rustsorter skip/build
      - name: Notify Rustsorter Status
        uses: tsickert/discord-webhook@v6.0.0
        if: success()
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ steps.check_rust.outputs.skip_rust == 'true' && '[CI/CD] skipping rustsorter - no changes detected' || '[CI/CD] building rustsorter...' }}
          embed-url: ${{ env.WORKFLOW_URL }}
          embed-color: ${{ steps.check_rust.outputs.skip_rust == 'true' && '16776960' || '3447003' }}
          embed-thumbnail-url: ${{ steps.check_rust.outputs.skip_rust == 'true' && 'https://img.icons8.com/fluency/144/stop--v1.png' || 'https://img.icons8.com/glyph-neue/64/FFFFFF/construction-worker.png' }}
          embed-timestamp: ${{ github.event.head_commit.timestamp || '' }}

      # Add notification for borter skip/build
      - name: Notify Borter Status
        uses: tsickert/discord-webhook@v6.0.0
        if: success()
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ steps.check_bort.outputs.skip_bort == 'true' && '[CI/CD] skipping borter - no changes detected' || '[CI/CD] building borter...' }}
          embed-url: ${{ env.WORKFLOW_URL }}
          embed-color: ${{ steps.check_bort.outputs.skip_bort == 'true' && '16776960' || '3447003' }}
          embed-thumbnail-url: ${{ steps.check_bort.outputs.skip_bort == 'true' && 'https://img.icons8.com/fluency/144/stop--v1.png' || 'https://img.icons8.com/glyph-neue/64/FFFFFF/construction-worker.png' }}
          embed-timestamp: ${{ github.event.head_commit.timestamp || '' }}

      # Step 5: Setup SSH for Deployment
      - name: Setup SSH for Deployment
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ github.ref_name == 'production' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGING }}

      - name: Deploy to Server
        id: deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ github.ref_name == 'production' && secrets.DO_SSH_HOST || secrets.DO_SSH_HOST_STAGING }}
          username: deployer
          key: ${{ github.ref_name == 'production' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGING }}
          command_timeout: 44m
          port: 22
          script: |
            set -e

            # Clear the ~/sorter directory 
            rm -rf ~/sorter

            # Clone from the appropriate branch
            git clone git@github.com:sorterisntonline/sorter.git -b ${{ env.BRANCH }} ~/sorter

            cd ~/sorter || exit

            # Write forter/.env
            cat <<EOF > forter/.env
            # forter/.env

            # Linear Integration
            VITE_LINEAR_CLIENT_ID=${{ secrets.BORTER_LINEAR_CLIENT_ID }}

            # Spotify Integration
            VITE_SPOTIFY_CLIENT_ID=${{ secrets.BORTER_SPOTIFY_CLIENT_ID }}

            # YouTube Integration
            VITE_YOUTUBE_CLIENT_ID=${{ secrets.BORTER_YOUTUBE_CLIENT_ID }}
            EOF

            chmod 600 forter/.env

            
            # Write rustsorter/.env
            cat <<EOF > rustsorter/.env
            # rustsorter/.env

            
            DISCORD_TOKEN=${{ secrets.RUSTSORTER_DISCORD_TOKEN }}
            EOF

            chmod 600 rustsorter/.env


            # Write borter/.env
            cat <<EOF > borter/.env
            # borter/.env
            HOSTNAME=${{ secrets.HOSTNAME }}

            # REPL Password
            REPL_PASSWORD=${{ github.ref_name == 'production' && secrets.BORTER_REPL_PASSWORD || secrets.BORTER_REPL_PASSWORD_STAGING }}

            # Linear Integration
            BORTER_LINEAR_CLIENT_ID=${{ secrets.BORTER_LINEAR_CLIENT_ID }}
            BORTER_LINEAR_CLIENT_SECRET=${{ secrets.BORTER_LINEAR_CLIENT_SECRET }}

            # Spotify Integration
            BORTER_SPOTIFY_CLIENT_ID=${{ secrets.BORTER_SPOTIFY_CLIENT_ID }}
            BORTER_SPOTIFY_CLIENT_SECRET=${{ secrets.BORTER_SPOTIFY_CLIENT_SECRET }}

            # Reddit Integration
            BORTER_REDDIT_CLIENT_ID=${{ secrets.BORTER_REDDIT_CLIENT_ID }}
            BORTER_REDDIT_SECRET=${{ secrets.BORTER_REDDIT_SECRET }}

            # Twitter Integration
            BORTER_TWITTER_KEY=${{ secrets.BORTER_TWITTER_KEY }}
            BORTER_TWITTER_KEY_SECRET=${{ secrets.BORTER_TWITTER_KEY_SECRET }}
            BORTER_TWITTER_BEARER_TOKEN=${{ secrets.BORTER_TWITTER_BEARER_TOKEN }}
            BORTER_TWITTER_OAUTH_CLIENTID=${{ secrets.BORTER_TWITTER_OAUTH_CLIENTID }}
            BORTER_TWITTER_OAUTH_CLIENTSECRET=${{ secrets.BORTER_TWITTER_OAUTH_CLIENTSECRET }}

            # YouTube Integration
            BORTER_YOUTUBE_API_KEY=${{ secrets.BORTER_YOUTUBE_API_KEY }}
            BORTER_YOUTUBE_CLIENT_ID=${{ secrets.BORTER_YOUTUBE_CLIENT_ID }}
            BORTER_YOUTUBE_CLIENT_SECRET=${{ secrets.BORTER_YOUTUBE_CLIENT_SECRET }}
            BORTER_YOUTUBE_REDIRECT_URIS=${{ secrets.BORTER_YOUTUBE_REDIRECT_URIS }}
            BORTER_YOUTUBE_JAVASCRIPT_ORIGINS=${{ secrets.BORTER_YOUTUBE_JAVASCRIPT_ORIGINS }}

            BORTER_SENDGRID_API_KEY=${{ secrets.BORTER_SENDGRID_API_KEY }}
            EOF

            chmod 600 borter/.env 

            echo -e "\033[1mDone writing env files, building...\033[0m"  
            
            # Modified build steps to respect skip flags
            if [[ "${{ steps.check_bort.outputs.skip_bort }}" != "true" ]]; then
              # clear assets from previous builds
              cd borter
              rm -rf resources/public/assets/*.css
              rm -rf resources/public/assets/*.js
              rm -rf resources/public/new/assets/*.css
              rm -rf resources/public/new/assets/*.js
              cd ..
              echo -e "\033[1mDone clearing assets, building...\033[0m"

              # Build forter
              echo -e "\033[3mBuilding forter...\033[0m"
              cd forter
              npm install
              npm run ${{ env.BRANCH }}
              cd ..

              # Build clisorter
              echo -e "\033[3mBuilding clisorter...\033[0m"
              cd clisorter
              npm install
              npm run build # eventually this needs to include mode via branch or something like that
              cd ..

              # Build borter
              echo -e "\033[3mBuilding borter...\033[0m"
              cd borter
              clojure -X:build build-client
              clojure -X:build uberjar
              chmod +x target/sorter-*-standalone.jar 
              cd ..
            fi

            # Conditional rustsorter build
            echo -e "\033[3mHandling rustsorter...\033[0m"
            if [[ "${{ steps.check_rust.outputs.skip_rust }}" == "true" ]]; then
              echo -e "\033[3mSkipping rustsorter build (no changes detected)...\033[0m"
            else
              echo -e "\033[3mBuilding rustsorter...\033[0m"
              cd rustsorter
              # Source the prod.env file before building
              if [ -f "/home/deployer/prod.env" ]; then
                source /home/deployer/prod.env
                export DATABASE_URL
              else
                echo "WARNING: prod.env file not found at /home/deployer/prod.env, building with sqlx_offline"
                SQLX_OFFLINE=true
              fi
              /home/deployer/.cargo/bin/cargo build --profile ${{ env.BUILD_MODE == 'prod' && 'release' || 'staging' }}  
              cd ..
            fi

            echo -e "\033[1mDone building, running (with systemctl)...\033[0m"

            # Reload systemd to recognize new services (if any changes)
            # TODO: we shouldn't need to do this? 
            echo -e "\033[3mReloading systemd...\033[0m"
            sudo systemctl daemon-reload

            # Backup borter jar if we built it
            if [[ "${{ steps.check_bort.outputs.skip_bort }}" != "true" ]]; then
              echo -e "\033[3mBacking up borter jar...\033[0m"
              BORTER_BACKUP_DIR="/home/deployer/backups/borter"

              # Create the backup directory if it doesn't exist
              mkdir -p "${BORTER_BACKUP_DIR}"

              BORTER_BACKUP_NAME="borter-$(date +%Y%m%d_%H%M%S).jar"
              cp borter/target/sorter-*-standalone.jar "${BORTER_BACKUP_DIR}/${BORTER_BACKUP_NAME}"
              
              # Keep only the 40 most recent borter backups (approximately 2GB worth)
              cd "${BORTER_BACKUP_DIR}"
              ls -t | tail -n +41 | xargs -r rm --
              cd ~/sorter
            fi

            # Backup rustsorter release if we built it
            if [[ "${{ steps.check_rust.outputs.skip_rust }}" != "true" ]]; then
              echo -e "\033[3mBacking up rustsorter release...\033[0m"
              RUST_BACKUP_DIR="/home/deployer/backups/rustsorter"
              RUST_BACKUP_NAME="rustsorter-$(date +%Y%m%d_%H%M%S)"
              
              # Create a new backup directory for this release
              mkdir -p "${RUST_BACKUP_DIR}/${RUST_BACKUP_NAME}"
              
              # Copy the entire release directory using the correct build profile
              cp -r rustsorter/target/${{ env.BUILD_MODE == 'prod' && 'release' || 'staging' }}/* "${RUST_BACKUP_DIR}/${RUST_BACKUP_NAME}/"
              
              # Keep only the 4 most recent rustsorter backups
              cd "${RUST_BACKUP_DIR}"
              ls -t | tail -n +5 | xargs -r rm -rf --
              cd ~/sorter
            fi 

            # Create live directories and symlinks if they don't exist
            sudo mkdir -p /home/deployer/live/borter
            sudo mkdir -p /home/deployer/live/rustsorter
            sudo chown deployer:deployer /home/deployer/live/borter
            sudo chown deployer:deployer /home/deployer/live/rustsorter

            # Update symlinks - if we didn't build a component, link to its most recent backup
            echo -e "\033[3mUpdating live symlinks...\033[0m"
            
            # Handle borter symlinks
            if [[ "${{ steps.check_bort.outputs.skip_bort }}" != "true" ]]; then
              echo "Linking newly built borter jar..."
              ln -sf ~/sorter/borter/target/sorter-*-standalone.jar /home/deployer/live/borter/sorter.jar
            else
              echo "Linking most recent borter backup..."
              LATEST_BORTER=$(ls -t /home/deployer/backups/borter/borter-*.jar | head -n1)
              if [ ! -z "$LATEST_BORTER" ]; then
                ln -sf "$LATEST_BORTER" /home/deployer/live/borter/sorter.jar
              else
                echo "WARNING: No borter backup found!"
              fi
            fi

            # Handle rustsorter symlinks
            if [[ "${{ steps.check_rust.outputs.skip_rust }}" != "true" ]]; then
              echo "Linking newly built rustsorter..."
              rm -f /home/deployer/live/rustsorter/current
              ln -sf ~/sorter/rustsorter/target/${{ env.BUILD_MODE == 'prod' && 'release' || 'staging' }} /home/deployer/live/rustsorter/current
            else
              echo "Linking most recent rustsorter backup..."
              LATEST_RUST=$(ls -t /home/deployer/backups/rustsorter | head -n1)
              if [ ! -z "$LATEST_RUST" ]; then
                rm -f /home/deployer/live/rustsorter/current
                ln -sf "/home/deployer/backups/rustsorter/$LATEST_RUST" /home/deployer/live/rustsorter/current
              else
                echo "WARNING: No rustsorter backup found!"
              fi
            fi

            # Restart services
            echo -e "\033[3mRestarting borter...\033[0m"
            sudo systemctl restart borter.service
            echo -e "\033[3mRestarting rustsorter...\033[0m"
            sudo systemctl restart rustsorter.service

            exit 0

      # Step 7: Generate Release Notes
      - name: Generate Release Notes
        id: release_notes
        if: success() && steps.deploy.outcome == 'success'
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.sha }}^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --pretty=format:'- %s' ${{ github.sha }})
          else
            NOTES=$(git log $PREVIOUS_TAG..${{ github.sha }} --pretty=format:'- %s')
          fi
          
          if [ "${{ steps.check_rust.outputs.skip_rust }}" == "true" ]; then
            NOTES="⏭️🦀 [SKIP-RUST] No changes detected in rustsorter - previous build retained.

            ${NOTES}"
          fi
          
          if [ "${{ steps.check_bort.outputs.skip_bort }}" == "true" ]; then
            NOTES="⏭️ƛ [SKIP-BORT] No changes detected in borter components - previous builds retained.

            ${NOTES}"
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 8: Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        if: success() && steps.deploy.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.new_tag.outputs.tag }}
          name: "Release ${{ steps.new_tag.outputs.tag }}"
          body: "${{ steps.release_notes.outputs.notes }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # New fallback step that runs on deploy failure
      - name: Fallback to Latest Backup
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ github.ref_name == 'production' && secrets.DO_SSH_HOST || secrets.DO_SSH_HOST_STAGING }}
          username: deployer
          key: ${{ github.ref_name == 'production' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGING }}
          script: |
            set -e
            
            # Handle borter fallback if we were attempting to build it
            if [[ "${{ steps.check_bort.outputs.skip_bort }}" != "true" ]] && [[ "${{ steps.new_tag.outputs.tag }}" != *"-NOBUILD"* ]]; then
              echo "Falling back to latest borter backup..."
              LATEST_BORTER=$(ls -t /home/deployer/backups/borter/sorter-*.jar | head -n1)
              if [ ! -z "$LATEST_BORTER" ]; then
                ln -sf "$LATEST_BORTER" /home/deployer/live/borter/sorter.jar
                sudo systemctl restart borter.service
              fi
            fi

            # Handle rustsorter fallback if we were attempting to build it
            if [[ "${{ steps.check_rust.outputs.skip_rust }}" != "true" ]] && [[ "${{ steps.new_tag.outputs.tag }}" != *"-NOBUILD"* ]]; then
              echo "Falling back to latest rustsorter backup..."
              LATEST_RUST=$(ls -t /home/deployer/backups/rustsorter | head -n1)
              if [ ! -z "$LATEST_RUST" ]; then
                rm -f /home/deployer/live/rustsorter/current
                ln -sf "/home/deployer/backups/rustsorter/$LATEST_RUST" /home/deployer/live/rustsorter/current
                sudo systemctl restart rustsorter.service
              fi
            fi

      # Add notification for successful deployment
      - name: Notify Successful Deployment
        if: success() && steps.deploy.outcome == 'success'
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          embed-title: "[CI/CD] build succeeded"
          embed-url: ${{ env.WORKFLOW_URL }}
          embed-color: "5763719"
          embed-thumbnail-url: "https://img.icons8.com/fluency/144/ok--v1.png"
          embed-timestamp: ${{ github.event.head_commit.timestamp || '' }}
          embed-description: |
            ${{ vars.DISCORD_WEBHOOK_PING_ROLEID && format('<@&{0}>', vars.DISCORD_WEBHOOK_PING_ROLEID) || '' }}
            **Release:** [${{ steps.new_tag.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.new_tag.outputs.tag }})
            
            ${{ steps.release_notes.outputs.notes }}

      # Add notification for fallback
      - name: Notify Fallback
        if: failure() && steps.deploy.outcome == 'failure'
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          embed-title: "[CI/CD] build failed - falling back to backup"
          embed-url: ${{ env.WORKFLOW_URL }}
          embed-color: "15158332"
          embed-thumbnail-url: "https://img.icons8.com/color/144/undelete.png"
          embed-timestamp: ${{ github.event.head_commit.timestamp || '' }}
          embed-description: ${{ vars.DISCORD_WEBHOOK_PING_ROLEID && format('<@&{0}>', vars.DISCORD_WEBHOOK_PING_ROLEID) || '' }}
          embed-author-name: ${{ github.triggering_actor || github.actor }}
          embed-author-url: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          embed-author-icon-url: https://github.com/${{ github.triggering_actor || github.actor }}.png