name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build and Test (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustsorter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustsorter/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rustsorter/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build
        run: |
          cargo build --locked --workspace --all-targets

      - name: Run tests (nextest) and generate JUnit
        run: |
          cargo nextest run --workspace --junit-report target/nextest/junit.xml

      - name: Upload test report to GitHub UI
        if: always()
        uses: actions/upload-test-report@v1
        with:
          report_paths: rustsorter/target/nextest/junit.xml

      - name: Upload JUnit as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: rustsorter/target/nextest/junit.xml
