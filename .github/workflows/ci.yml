name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build and Test (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustsorter

    env:
      # Speed up builds
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustsorter

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.67

      - name: Show tool versions
        run: |
          rustc -V
          cargo -V
          cargo nextest -V

      - name: Run tests (nextest) and generate JUnit
        run: |
          SQLX_OFFLINE=true cargo nextest run --locked --workspace --profile ci

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Rust Tests
          path: rustsorter/target/nextest/junit.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Upload JUnit as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: rustsorter/target/nextest/junit.xml
