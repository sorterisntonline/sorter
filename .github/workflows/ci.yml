name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build and Test (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustsorter

    # PostgreSQL service for sqlx compile-time checks and tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Speed up builds (incremental off is usually faster/cleaner in CI)
      CARGO_INCREMENTAL: "0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
      DBMATE_MIGRATIONS_DIR: ../db/migrations
      DBMATE_NO_DUMP_SCHEMA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustsorter
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.67

      - name: Show tool versions
        run: |
          rustc -V
          cargo -V
          cargo nextest -V

      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
          dbmate --version

      - name: Prepare database (create + migrate)
        run: |
          dbmate --wait up

      - name: Run tests (nextest) and generate JUnit
        run: |
          cargo nextest run --locked --workspace --profile ci

      - name: Debug JUnit presence
        if: always()
        run: |
          pwd
          echo "Listing from rustsorter (cwd):" && ls -la
          echo "Listing target:" && ls -la target || true
          echo "Listing target/nextest:" && ls -la target/nextest || true
          echo "Search for junit.xml from repo root:" 
          (cd .. && find . -maxdepth 4 -type f -name "junit.xml" -print)

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Rust Tests
          path: rustsorter/target/nextest/**/*.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Upload JUnit as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: rustsorter/target/nextest/junit.xml
