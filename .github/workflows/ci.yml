name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build and Test (Rust)
    runs-on: [self-hosted, texas, jason]
    defaults:
      run:
        working-directory: rustsorter

    # PostgreSQL service for dbmate migrations and tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5439:5432

    env:
      # Speed up builds (incremental off is usually faster/cleaner in CI)
      CARGO_INCREMENTAL: "0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5439/test_db?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "1"
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustsorter
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.67

      - name: Show tool versions
        run: |
          rustc -V
          cargo -V
          cargo nextest -V

      - name: Set up Python and UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install project dependencies
        working-directory: .
        run: uv sync

      - name: Setup environment (CI mode)
        working-directory: .
        run: uv run main.py setup --ci

      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
          dbmate --version

      - name: Prepare database (create + migrate)
        working-directory: .
        run: uv run main.py migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5439/test_db?sslmode=disable

      - name: Build Rust backend
        working-directory: .
        run: uv run main.py build-rust

      - name: Generate TypeScript types
        working-directory: .
        run: uv run main.py generate-ts

      - name: Run Rust tests (nextest)
        working-directory: .
        run: uv run main.py test-rust --ci

      - name: Debug JUnit presence
        if: always()
        run: |
          pwd
          echo "Listing from rustsorter (cwd):" && ls -la
          echo "Listing target:" && ls -la target || true
          echo "Listing target/nextest:" && ls -la target/nextest || true
          echo "Search for junit.xml from repo root:" 
          (cd .. && find . -maxdepth 4 -type f -name "junit.xml" -print)

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Rust Tests
          path: rustsorter/target/nextest/**/*.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Upload JUnit as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: rustsorter/target/nextest/junit.xml

      - name: Start Rust server (no rebuild)
        working-directory: rustsorter
        env:
          RUST_LOG: info
        run: |
          set -euo pipefail
          if [ ! -x ./target/debug/rustsorter ]; then
            echo "Binary not found, exiting..."
            exit 1
          fi
          nohup ./target/debug/rustsorter > server.log 2>&1 & echo $! > server.pid
          echo "Waiting for server..."
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8081/api/health > /dev/null; then
              echo "Server is up"; break;
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8081/api/health > /dev/null; then
            echo "Server failed to start. Showing server.log:" && echo "-----" && tail -n +1 server.log || true
            exit 1
          fi

      
      - name: Run Python tests (pytest)
        working-directory: .
        run: uv run main.py test-python --junit-xml

      - name: Publish Python test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Python Tests
          path: test/python-tests.xml
          reporter: java-junit

      - name: Upload Python JUnit artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-junit-report
          path: test/python-tests.xml

      - name: Stop Rust server
        if: always()
        working-directory: rustsorter
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
