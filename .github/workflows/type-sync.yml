name: Auto-Sync Types from Rust Backend

on:
  push:
    branches: [main, staging, rust-port]
    paths: ['rustsorter/**']
  pull_request:
    branches: [main, staging, rust-port]
    paths: ['rustsorter/**']

jobs:
  sync-types:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sorter
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontsorter/package-lock.json

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install database CLI
        working-directory: database/cli
        run: npm install -g .

      - name: Setup database
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/sorter"
          sorter-db migrate

      - name: Start Rust backend
        working-directory: rustsorter
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/sorter"
          cargo build --release
          cargo run --release &
          sleep 10  # Wait for backend to start

      - name: Install frontend dependencies
        working-directory: frontsorter
        run: npm ci

      - name: Generate types from backend
        working-directory: frontsorter
        run: npm run generate-types

      - name: Check for type changes
        id: check-changes
        run: |
          cd frontsorter
          if git diff --exit-code src/generated/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated types
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          cd frontsorter
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/generated/
          git commit -m "🤖 Auto-update types from Rust backend

          Generated by GitHub Actions from backend changes

          🤖 Generated with [Claude Code](https://claude.ai/code)

          Co-Authored-By: Claude <noreply@anthropic.com>"

      - name: Push changes
        if: steps.check-changes.outputs.changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: TypeScript check
        working-directory: frontsorter
        run: npm run type-check

      - name: Build frontend
        working-directory: frontsorter
        run: npm run build