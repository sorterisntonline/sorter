name: deploy to fly.io

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

concurrency:
  group: fly-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' ||
      github.event_name == 'push' && github.ref_name == 'staging'
    name: deploy sorter-fly-app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: deploy
        run: flyctl deploy --remote-only --ha=false --strategy immediate --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-prod:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.environment == 'production' ||
      github.event_name == 'push' && github.ref_name == 'production'
    name: deploy sorter-fly-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: deploy
        run: flyctl deploy --config fly.prod.toml --remote-only --ha=false --strategy immediate --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
