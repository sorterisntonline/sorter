[supervisord]
nodaemon=true
loglevel=info

[program:borter]
command=clojure -J-Djdk.attach.allowAttachSelf -A:dev -X prod/-main :port 3000
directory=/app/borter
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
environment=DATABASE_URL="postgres://%(ENV_POSTGRES_USER)s:%(ENV_POSTGRES_PASSWORD)s@db:5432/%(ENV_POSTGRES_DB)s",ENVIRONMENT="%(ENV_ENVIRONMENT)s"

[program:forter]
command=npm run dev
directory=/app/forter
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=VITE_API_URL="%(ENV_VITE_API_URL)s",ENVIRONMENT="%(ENV_ENVIRONMENT)s" 