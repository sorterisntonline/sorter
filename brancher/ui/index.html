<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ranking Replay 2</title>
    
    <!-- External Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@tanstack/react-query@4/build/umd/index.production.js"></script>
    
    <!-- Styles -->
    <style>
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
        }
        .chart-container {
            width: 100%;
            height: 400px;
            margin: 20px 0;
            display: flex;
            gap: 20px;
        }
        .chart-wrapper {
            flex: 3;
            position: relative;
        }
        .rankings-legend {
            flex: 1;
            padding: 20px;
            border-left: 1px solid #ccc;
            overflow-y: auto;
            max-height: 400px;
        }
        .content {
            display: flex;
        }
        .rankings, .history {
            flex: 1;
            padding: 20px;
            margin: 10px;
            border: 1px solid #ccc;
        }
        .comparison {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }
        .controls input[type="range"] {
            flex: 1;
        }
        #playPauseBtn {
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 2rem; }
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .dialog-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { QueryClient, QueryClientProvider, useQuery } = ReactQuery;

        const queryClient = new QueryClient();

        function RankingApp() {
            const [currentStep, setCurrentStep] = useState(0);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const [dialogData, setDialogData] = useState(null);

            // No longer need to fetch a list of files.
            // We will directly fetch the data served by our CLI.

            // Query for run data
            const { data, isLoading, isError } = useQuery({
                queryKey: ['runData'], // A simple, static key
                queryFn: () =>
                    fetch('/data.json').then(res => res.json()), // Fetch the specific endpoint
                onSuccess: (newData) => {
                    // Set to the latest step when new data arrives
                    if (newData && newData.history) {
                        setCurrentStep(newData.history.length - 1);
                    }
                },
                refetchInterval: 5000,
                refetchIntervalInBackground: true
            });

            // Chart effect
            useEffect(() => {
                if (data && data.items && Array.isArray(data.items) && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: data.items.map((item, i) => ({
                                label: formatId ? formatId(item) : item,
                                data: [],
                                borderColor: `hsl(${(i * 360) / data.items.length}, 70%, 50%)`,
                                tension: 0.4
                            }))
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            scales: {
                                y: { beginAtZero: true }
                            },
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            hover: {
                                mode: 'dataset',
                                intersect: false
                            }
                        }
                    });

                    // Call updateChart after initialization
                    updateChart();
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data]);

            // Also add an effect to update chart when currentStep changes
            useEffect(() => {
                updateChart();
            }, [currentStep]);



            const updateChart = () => {
                if (!data || !data.items || !Array.isArray(data.items) || !chartInstance.current) return;
                
                const chart = chartInstance.current;
                
                // Generate labels from 1 to currentStep + 1
                chart.data.labels = Array.from({length: currentStep + 1}, (_, i) => i + 1);
                
                // Update each dataset with all points up to currentStep
                data.items.forEach((item, i) => {
                    chart.data.datasets[i].data = data.history
                        .slice(0, currentStep + 1)
                        .map(step => {
                            const ranking = step.current_rankings.find(r => r.identifier && r.identifier.pk === item);
                            return ranking ? ranking.score : null;
                        });
                });
                
                chart.update();
            };

            // No longer need file selector - we always use the same data source

            // Helper to format identifiers by splitting on ':' and taking the first part
            const formatId = (value) => {
                const str = typeof value === 'string'
                    ? value
                    : (value && (value.pk || (value.identifier && value.identifier.pk))) || '';
                if (!str) return '';
                const parts = str.split(':');
                return parts[0] || str; // Return first part before ':', or whole string if no ':'
            };

            // Loading state
            if (isLoading) {
                return <div className="loading">Loading...</div>;
            }

            // Error state
            if (isError) {
                return <div className="loading">Error loading data</div>;
            }

            const currentHistory = data && data.history ? data.history[currentStep] : null;
            // Build a safe finalMatrix fallback if data.final_matrix is missing or mismatched
            const finalMatrix = (data && Array.isArray(data.items))
                ? (
                    Array.isArray(data.final_matrix) && data.final_matrix.length === data.items.length
                        ? data.final_matrix
                        : data.items.map(() => data.items.map(() => ({ weight: 0 })))
                  )
                : [];

            return (
                <div className="container">
                    <div className="controls">
                        {data && data.history && (
                            <div>
                                <input
                                    type="range"
                                    min="0"
                                    max={data.history.length - 1}
                                    value={currentStep}
                                    onChange={(e) => setCurrentStep(Number(e.target.value))}
                                />
                                <span>Step: {currentStep} / {data.history.length - 1}</span>
                            </div>
                        )}
                    </div>

                    <div className="chart-container">
                        <div className="chart-wrapper">
                            <canvas ref={chartRef}></canvas>
                        </div>
                        <div className="rankings-legend">
                            <h3>Current Rankings</h3>
                            {currentHistory && currentHistory.current_rankings
                                .sort((a, b) => b.score - a.score)
                                .map((r, i) => (
                                    <div key={r.identifier ? r.identifier.pk : i} title={r.identifier ? r.identifier.pk : ''}>
                                        {i+1}. {r.identifier ? formatId(r.identifier.pk) : 'Unknown'} ({r.score.toFixed(4)})
                                    </div>
                                ))
                            }
                            <h3>Unsorted Items</h3>
                            {currentHistory && currentHistory.unsorted_items &&
                                currentHistory.unsorted_items.map(item => (
                                    <div key={item.pk || item} title={item.pk || item}>• {formatId(item.pk || item)}</div>
                                ))
                            }
                        </div>
                    </div>

                    <div className="content">
                        <div className="rankings">
                            <h3>Comparison Matrix</h3>
                            {data && Array.isArray(data.items) && Array.isArray(finalMatrix) && (() => {
                                // Get final rankings to sort by score (highest to lowest)
                                const finalRankings = currentHistory && currentHistory.current_rankings 
                                    ? currentHistory.current_rankings.sort((a, b) => b.score - a.score)
                                    : [];
                                
                                // Create sorted item indices based on final rankings
                                const sortedIndices = [];
                                const usedIndices = new Set();
                                
                                // First, add items that appear in current rankings (sorted by score)
                                finalRankings.forEach(ranking => {
                                    const originalIndex = data.items.findIndex(item => item === (ranking.identifier ? ranking.identifier.pk : ranking));
                                    if (originalIndex !== -1 && !usedIndices.has(originalIndex)) {
                                        sortedIndices.push(originalIndex);
                                        usedIndices.add(originalIndex);
                                    }
                                });
                                
                                // Then add any remaining items that weren't in rankings
                                data.items.forEach((item, index) => {
                                    if (!usedIndices.has(index)) {
                                        sortedIndices.push(index);
                                    }
                                });
                                
                                return (
                                    <table style={{ borderCollapse: 'collapse', fontSize: '0.8em' }}>
                                        <thead>
                                            <tr>
                                                <th></th>
                                                {sortedIndices.map(j => {
                                                    const item = data.items[j];
                                                    return (
                                                        <th key={item} style={{ padding: '4px' }} title={item}>{formatId(item)}</th>
                                                    );
                                                })}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sortedIndices.map(i => {
                                                const row_item = data.items[i];
                                                return (
                                                    <tr key={row_item}>
                                                        <td style={{ padding: '4px' }} title={row_item}>{formatId(row_item)}</td>
                                                        {sortedIndices.map(sortedJ => {
                                                            const j = sortedIndices[sortedJ];
                                                            const cell = (finalMatrix[i] && finalMatrix[i][j]) || { weight: 0 };
                                                            const safeCell = cell || { weight: 0 };
                                                            const mirrorCell = (finalMatrix[j] && finalMatrix[j][i]) ? finalMatrix[j][i] : null;
                                                            const details = (safeCell.details) || (mirrorCell && mirrorCell.details);
                                                            
                                                            // Calculate color based on weight
                                                            let backgroundColor = 'white';
                                                            if (safeCell.weight > 0) {
                                                                if (safeCell.weight < 50) {
                                                                    const intensity = Math.floor((safeCell.weight / 50) * 255);
                                                                    backgroundColor = `rgb(255, ${intensity}, ${intensity})`;
                                                                } else {
                                                                    const intensity = Math.floor(((100 - safeCell.weight) / 50) * 255);
                                                                    backgroundColor = `rgb(${intensity}, 255, ${intensity})`;
                                                                }
                                                            }
                                                            
                                                            return (
                                                                <td key={j} style={{ 
                                                                    padding: '4px', 
                                                                    border: '1px solid #ccc',
                                                                    cursor: details ? 'pointer' : 'default',
                                                                    backgroundColor,
                                                                    color: 'inherit'
                                                                }}
                                                                onClick={() => {
                                                                    if (details) {
                                                                        // Format vote data for dialog
                                                                        const leftEntity = formatId(details.left_entity_pk);
                                                                        const rightEntity = formatId(details.right_entity_pk);
                                                                        const magnitude = details.magnitude;
                                                                        const rationale = details.rationale;
                                                                        
                                                                        // Determine winner based on magnitude
                                                                        let winner, loser, confidence;
                                                                        if (magnitude < 0) {
                                                                            winner = leftEntity;
                                                                            loser = rightEntity;
                                                                            confidence = Math.abs(magnitude);
                                                                        } else if (magnitude > 0) {
                                                                            winner = rightEntity;
                                                                            loser = leftEntity;
                                                                            confidence = magnitude;
                                                                        } else {
                                                                            winner = null;
                                                                            loser = null;
                                                                            confidence = 0;
                                                                        }
                                                                        
                                                                        setDialogData({
                                                                            leftEntity,
                                                                            rightEntity,
                                                                            magnitude,
                                                                            winner,
                                                                            loser,
                                                                            confidence,
                                                                            rationale,
                                                                            weight: safeCell.weight
                                                                        });
                                                                    }
                                                                }}>
                                                                    {i === j ? '×' : safeCell.weight > 0 ? safeCell.weight.toFixed(1) : ''}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                );
                            })()}
                        </div>
                    </div>

                    {dialogData && (
                        <div className="dialog-overlay" onClick={() => setDialogData(null)}>
                            <div className="dialog-content" onClick={e => e.stopPropagation()}>
                                <h3>Vote Details</h3>
                                <div style={{ marginBottom: '15px' }}>
                                    <p><strong>Comparison:</strong> {dialogData.leftEntity} vs {dialogData.rightEntity}</p>
                                    <p><strong>Raw Magnitude:</strong> {dialogData.magnitude} (range: -50 to +50)</p>
                                    <p><strong>Matrix Weight:</strong> {dialogData.weight ? dialogData.weight.toFixed(1) : 'N/A'}</p>
                                    {dialogData.winner ? (
                                        <p><strong>Winner:</strong> {dialogData.winner} (confidence: {dialogData.confidence}/50)</p>
                                    ) : (
                                        <p><strong>Result:</strong> Tie (neutral vote)</p>
                                    )}
                                </div>
                                {dialogData.rationale ? (
                                    <div style={{ marginBottom: '15px' }}>
                                        <p><strong>Rationale:</strong></p>
                                        <div style={{ 
                                            backgroundColor: '#f5f5f5', 
                                            padding: '10px', 
                                            borderRadius: '5px',
                                            fontStyle: 'italic',
                                            whiteSpace: 'pre-wrap'
                                        }}>
                                            {dialogData.rationale}
                                        </div>
                                    </div>
                                ) : (
                                    <p style={{ fontStyle: 'italic', color: '#666' }}>No rationale provided for this vote.</p>
                                )}
                                <button onClick={() => setDialogData(null)}>Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            return (
                <QueryClientProvider client={queryClient}>
                    <RankingApp />
                </QueryClientProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
