<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ranking Replay 2</title>
    
    <!-- External Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@tanstack/react-query@4/build/umd/index.production.js"></script>
    
    <!-- Styles -->
    <style>
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
        }
        .chart-container {
            width: 100%;
            height: 400px;
            margin: 20px 0;
            display: flex;
            gap: 20px;
        }
        .chart-wrapper {
            flex: 3;
            position: relative;
        }
        .rankings-legend {
            flex: 1;
            padding: 20px;
            border-left: 1px solid #ccc;
            overflow-y: auto;
            max-height: 400px;
        }
        .content {
            display: flex;
        }
        .rankings, .history {
            flex: 1;
            padding: 20px;
            margin: 10px;
            border: 1px solid #ccc;
        }
        .comparison {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }
        .controls input[type="range"] {
            flex: 1;
        }
        #playPauseBtn {
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 2rem; }
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .dialog-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        /* NEW: Styles for dialog buttons */
        .dialog-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .dialog-buttons button {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            background-color: #f0f0f0;
        }
        .dialog-buttons button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .dialog-buttons .add-vote-btn {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
        }
        /* NEW: Styles for vote tabs */
        .vote-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .vote-tab {
            padding: 8px 16px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-bottom: none;
            background-color: #f5f5f5;
            margin-right: 2px;
            border-radius: 4px 4px 0 0;
            font-size: 0.9em;
        }
        .vote-tab.active {
            background-color: white;
            border-bottom: 1px solid white;
            margin-bottom: -1px;
            font-weight: bold;
        }
        .vote-tab:hover:not(.active) {
            background-color: #e9e9e9;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { QueryClient, QueryClientProvider, useQuery, useMutation, useQueryClient } = ReactQuery;

        const queryClient = new QueryClient();

        function RankingApp() {
            const [currentStep, setCurrentStep] = useState(0);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const [dialogData, setDialogData] = useState(null);
            const [votingCells, setVotingCells] = useState(new Set()); // Track multiple voting cells
            const [selectedVoteTab, setSelectedVoteTab] = useState(0); // Track which vote tab is selected
            const [selectedRun, setSelectedRun] = useState(null); // Track selected run

            // Query for available runs
            const { data: runsData, isLoading: runsLoading } = useQuery({
                queryKey: ['runs'],
                queryFn: () => fetch('/runs').then(res => res.json()),
                refetchOnWindowFocus: false,
                refetchOnReconnect: false
            });

            // Query for run data
            const { data, isLoading, isError } = useQuery({
                queryKey: ['runData', selectedRun],
                queryFn: () => {
                    const url = selectedRun ? `/data/${selectedRun}` : '/data.json';
                    return fetch(url).then(res => res.json());
                },
                onSuccess: (newData) => {
                    // Set to the latest step when new data arrives
                    if (newData && newData.history) {
                        setCurrentStep(newData.history.length - 1);
                    }
                },
                refetchOnWindowFocus: false,
                refetchOnReconnect: false,
                refetchInterval: 1000
                // refetchIntervalInBackground: true
            });

            // --- NEW: Mutation for triggering a vote ---
            const voteMutation = useMutation({
                mutationFn: async ({ pair, cellKey }) => {
                    const response = await fetch('/vote-pair', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(pair)
                    });
                    if (!response.ok) throw new Error('Vote request failed');
                    const result = await response.json();
                    return { result, cellKey };
                },
                onSuccess: ({ cellKey }) => {
                    console.log("Vote successful, refetching data...");
                    queryClient.invalidateQueries({ queryKey: ['runData'] });
                    // Remove this specific cell from loading state
                    setVotingCells(prev => {
                        const newSet = new Set(prev);
                        newSet.delete(cellKey);
                        return newSet;
                    });
                },
                onError: (error, { cellKey }) => {
                    console.error("Vote mutation failed:", error);
                    alert("Failed to cast vote. See console for details.");
                    // Remove this specific cell from loading state
                    setVotingCells(prev => {
                        const newSet = new Set(prev);
                        newSet.delete(cellKey);
                        return newSet;
                    });
                }
            });

            // Chart effect
            useEffect(() => {
                if (data && data.items && Array.isArray(data.items) && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: data.items.map((item, i) => ({
                                label: formatId ? formatId(item) : item,
                                data: [],
                                borderColor: `hsl(${(i * 360) / data.items.length}, 70%, 50%)`,
                                tension: 0.4
                            }))
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            scales: {
                                y: { 
                                    beginAtZero: true,
                                    min: 0,
                                    max: 100
                                }
                            },
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            hover: {
                                mode: 'dataset',
                                intersect: false
                            }
                        }
                    });

                    // Call updateChart after initialization
                    updateChart();
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data]);

            // Also add an effect to update chart when currentStep changes
            useEffect(() => {
                updateChart();
            }, [currentStep]);



            const updateChart = () => {
                if (!data || !data.items || !Array.isArray(data.items) || !chartInstance.current) return;
                
                const chart = chartInstance.current;
                
                // Generate labels from 1 to currentStep + 1
                chart.data.labels = Array.from({length: currentStep + 1}, (_, i) => i + 1);
                
                // Update each dataset with all points up to currentStep
                data.items.forEach((item, i) => {
                    chart.data.datasets[i].data = data.history
                        .slice(0, currentStep + 1)
                        .map(step => {
                            // Apply rescaling to current rankings before extracting scores
                            const rescaledRankings = rescaleScores(step.current_rankings);
                            const ranking = rescaledRankings.find(r => r.identifier && r.identifier.pk === item);
                            return ranking ? ranking.score : null;
                        });
                });
                
                chart.update();
            };

            // No longer need file selector - we always use the same data source

            // Helper to format identifiers by splitting on ':' and taking the first part
            const formatId = (value) => {
                const str = typeof value === 'string'
                    ? value
                    : (value && (value.pk || (value.identifier && value.identifier.pk))) || '';
                if (!str) return '';
                const parts = str.split(':');
                return parts[0] || str; // Return first part before ':', or whole string if no ':'
            };

            // Function to rescale scores using linear interpolation based on ranking position
            const rescaleScores = (rankings) => {
                if (!rankings || rankings.length === 0) return rankings;
                
                // Sort by original score (highest to lowest)
                const sorted = [...rankings].sort((a, b) => b.score - a.score);
                
                // Calculate new scores using linear interpolation
                // Top ranked gets 100, bottom gets 0, others distributed linearly
                const maxScore = 100;
                const minScore = 0;
                
                return sorted.map((ranking, index) => {
                    let newScore;
                    if (sorted.length === 1) {
                        newScore = maxScore;
                    } else {
                        // Linear interpolation: newScore = maxScore - (index / (length - 1)) * (maxScore - minScore)
                        newScore = maxScore - (index / (sorted.length - 1)) * (maxScore - minScore);
                    }
                    
                    return {
                        ...ranking,
                        score: newScore,
                        originalScore: ranking.score // Keep original for reference
                    };
                });
            };

            const handleCellClick = (rowItem, colItem, rowIdx, colIdx) => {
                const cellKey = `${rowIdx}-${colIdx}`;
                
                // Allow dialog viewing even during votes, but prevent new votes on cells already voting
                if (votingCells.has(cellKey)) return;

                const cell = (finalMatrix[rowItem.originalIndex] && finalMatrix[rowItem.originalIndex][colItem.originalIndex]) || {};
                const voteCount = cell.vote_count || 0;

                // If a vote exists, show dialog. Otherwise, trigger a new vote.
                if (voteCount > 0 && cell.details) {
                    const leftEntity = formatId(cell.details.left_entity_pk);
                    const rightEntity = formatId(cell.details.right_entity_pk);

                    // NEW: Store all votes, not just the most recent one
                    const allVotes = cell.votes || [cell.details];

                    // MODIFIED: Store the items and indices needed to trigger a new vote
                    setDialogData({
                        leftEntity,
                        rightEntity,
                        weight: cell.weight,
                        voteCount: voteCount,
                        allVotes: allVotes,
                        // NEW: Pass context to the dialog for the re-vote action
                        rowItem,
                        colItem,
                        displayRowIdx: rowIdx,
                        displayColIdx: colIdx,
                        cellKey
                    });
                    // Reset to the most recent vote (tab 0) when opening dialog
                    setSelectedVoteTab(0);
                } else if (rowItem.originalIndex !== colItem.originalIndex) {
                    // No vote exists, trigger one
                    console.log(`Voting on ${rowItem.item} vs ${colItem.item}`);
                    setVotingCells(prev => new Set([...prev, cellKey]));
                    const pair = {
                        entity_a: { pk_namespace: "gitsort.branch_snapshot", pk: rowItem.item },
                        entity_b: { pk_namespace: "gitsort.branch_snapshot", pk: colItem.item }
                    };
                    voteMutation.mutate({ pair, cellKey });
                }
            };

            // NEW: Handler for the "Add Another Vote" button in the dialog
            const handleAddVoteFromDialog = () => {
                if (!dialogData) return;

                const { rowItem, colItem, cellKey } = dialogData;

                // Check if this cell is already voting
                if (votingCells.has(cellKey)) return;

                // 1. Don't close the dialog - let user continue viewing it
                // 2. Set the loading state on the correct cell
                setVotingCells(prev => new Set([...prev, cellKey]));
                // 3. Construct the pair and trigger the mutation
                const pair = {
                    entity_a: { pk_namespace: "gitsort.branch_snapshot", pk: rowItem.item },
                    entity_b: { pk_namespace: "gitsort.branch_snapshot", pk: colItem.item }
                };
                console.log(`Adding another vote for ${rowItem.item} vs ${colItem.item}`);
                voteMutation.mutate({ pair, cellKey });
            };

            // Loading state
            if (isLoading) {
                return <div className="loading">Loading...</div>;
            }

            // Error state
            if (isError) {
                return <div className="loading">Error loading data</div>;
            }

            const currentHistory = data && data.history ? data.history[currentStep] : null;
            // Build a safe finalMatrix fallback if data.final_matrix is missing or mismatched
            const finalMatrix = (data && Array.isArray(data.items))
                ? (
                    Array.isArray(data.final_matrix) && data.final_matrix.length === data.items.length
                        ? data.final_matrix
                        : data.items.map(() => data.items.map(() => ({ weight: 0 })))
                  )
                : [];

            return (
                <div className="container">
                    {/* Run Selector */}
                    <div className="run-selector" style={{padding: '10px', borderBottom: '1px solid #ccc', marginBottom: '10px'}}>
                        <div style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
                            <label htmlFor="run-select">Select Run:</label>
                            <select 
                                id="run-select"
                                value={selectedRun || ''}
                                onChange={(e) => setSelectedRun(e.target.value || null)}
                                style={{padding: '5px', minWidth: '200px'}}
                            >
                                <option value="">Latest Run</option>
                                {runsData && runsData.map(run => (
                                    <option key={run.name} value={run.name}>
                                        {run.run_name} ({run.branches} branches, {run.model})
                                    </option>
                                ))}
                            </select>
                            {data && data.current_run && (
                                <span style={{marginLeft: '20px', color: '#666', fontSize: '0.9em'}}>
                                    Current: {data.current_run.run_name} | ID: {data.current_run.run_id && data.current_run.run_id.slice(0, 8)}...
                                </span>
                            )}
                        </div>
                    </div>

                    <div className="controls">
                        {data && data.history && (
                            <div>
                                <input
                                    type="range"
                                    min="0"
                                    max={data.history.length - 1}
                                    value={currentStep}
                                    onChange={(e) => setCurrentStep(Number(e.target.value))}
                                />
                                <span>Step: {currentStep} / {data.history.length - 1}</span>
                            </div>
                        )}
                    </div>

                    <div className="chart-container">
                        <div className="chart-wrapper">
                            <canvas ref={chartRef}></canvas>
                        </div>
                        <div className="rankings-legend">
                            <h3>Current Rankings</h3>
                            {currentHistory && (() => {
                                const rescaledRankings = rescaleScores(currentHistory.current_rankings);
                                return rescaledRankings
                                    .sort((a, b) => b.score - a.score)
                                    .map((r, i) => (
                                        <div key={r.identifier ? r.identifier.pk : i} title={`${r.identifier ? r.identifier.pk : ''}\nOriginal: ${r.originalScore ? r.originalScore.toFixed(4) : 'N/A'}\nRescaled: ${r.score.toFixed(1)}`}>
                                            {i+1}. {r.identifier ? formatId(r.identifier.pk) : 'Unknown'} ({r.score.toFixed(1)})
                                        </div>
                                    ));
                            })()}
                            <h3>Unsorted Items</h3>
                            {currentHistory && currentHistory.unsorted_items &&
                                currentHistory.unsorted_items.map(item => (
                                    <div key={item.pk || item} title={item.pk || item}>• {formatId(item.pk || item)}</div>
                                ))
                            }
                        </div>
                    </div>

                    <div className="content">
                        <div className="rankings">
                            <h3>Comparison Matrix</h3>
                            {data && Array.isArray(data.items) && Array.isArray(finalMatrix) && (() => {
                                // Get final rankings to sort by score (highest to lowest)
                                const finalRankings = currentHistory && currentHistory.current_rankings 
                                    ? currentHistory.current_rankings.sort((a, b) => b.score - a.score)
                                    : [];
                                
                                // Create sorted items array with their original indices
                                const sortedItems = [];
                                const usedItems = new Set();
                                
                                // First, add items that appear in current rankings (sorted by score)
                                finalRankings.forEach(ranking => {
                                    const itemId = ranking.identifier ? ranking.identifier.pk : ranking;
                                    const originalIndex = data.items.findIndex(item => item === itemId);
                                    if (originalIndex !== -1 && !usedItems.has(itemId)) {
                                        sortedItems.push({ item: itemId, originalIndex });
                                        usedItems.add(itemId);
                                    }
                                });
                                
                                // Then add any remaining items that weren't in rankings
                                data.items.forEach((item, index) => {
                                    if (!usedItems.has(item)) {
                                        sortedItems.push({ item, originalIndex: index });
                                    }
                                });
                                
                                return (
                                    <table style={{ borderCollapse: 'collapse', fontSize: '0.8em' }}>
                                        <thead>
                                            <tr>
                                                <th></th>
                                                {sortedItems.map(({ item }) => (
                                                    <th key={item} style={{ padding: '4px' }} title={item}>{formatId(item)}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sortedItems.map(({ item: rowItem, originalIndex: rowIdx }, displayRowIdx) => (
                                                <tr key={rowItem}>
                                                    <td style={{ padding: '4px' }} title={rowItem}>{formatId(rowItem)}</td>
                                                    {sortedItems.map(({ item: colItem, originalIndex: colIdx }, displayColIdx) => {
                                                        const cell = (finalMatrix[rowIdx] && finalMatrix[rowIdx][colIdx]) || { weight: 0, vote_count: 0 };
                                                        const safeCell = cell || { weight: 0, vote_count: 0 };
                                                        const mirrorCell = (finalMatrix[colIdx] && finalMatrix[colIdx][rowIdx]) ? finalMatrix[colIdx][rowIdx] : null;
                                                        const details = (safeCell.details) || (mirrorCell && mirrorCell.details);

                                                        const cellKey = `${displayRowIdx}-${displayColIdx}`;
                                                        const isVoting = votingCells.has(cellKey);
                                                        const voteCount = safeCell.vote_count || 0;

                                                        // Calculate color based on weight
                                                        let backgroundColor = 'white';
                                                        if (safeCell.weight > 0) {
                                                            if (safeCell.weight < 50) {
                                                                const intensity = Math.floor((safeCell.weight / 50) * 255);
                                                                backgroundColor = `rgb(255, ${intensity}, ${intensity})`;
                                                            } else {
                                                                const intensity = Math.floor(((100 - safeCell.weight) / 50) * 255);
                                                                backgroundColor = `rgb(${intensity}, 255, ${intensity})`;
                                                            }
                                                        }

                                                        return (
                                                            <td key={displayColIdx} style={{
                                                                padding: '4px',
                                                                border: '1px solid #ccc',
                                                                cursor: rowIdx !== colIdx && !isVoting ? 'pointer' : 'default',
                                                                backgroundColor,
                                                                color: 'inherit',
                                                                opacity: isVoting ? 0.5 : 1,
                                                            }}
                                                            onClick={() => handleCellClick(
                                                                { item: rowItem, originalIndex: rowIdx },
                                                                { item: colItem, originalIndex: colIdx },
                                                                displayRowIdx,
                                                                displayColIdx
                                                            )}>
                                                                {rowIdx === colIdx ? '×' :
                                                                 isVoting ? '...' :
                                                                 voteCount > 0 ? `${safeCell.weight.toFixed(1)} (${voteCount})` :
                                                                 ''}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                );
                            })()}
                        </div>
                    </div>

                    {dialogData && (
                        <div className="dialog-overlay" onClick={() => setDialogData(null)}>
                            <div className="dialog-content" onClick={e => e.stopPropagation()}>
                                <h3>Vote Details</h3>
                                <div style={{ marginBottom: '15px' }}>
                                    <p><strong>Comparison:</strong> {dialogData.leftEntity} vs {dialogData.rightEntity}</p>
                                    <p><strong>Avg. Matrix Weight:</strong> {dialogData.weight ? dialogData.weight.toFixed(1) : 'N/A'}</p>
                                    <p><strong>Total Votes:</strong> {dialogData.voteCount}</p>
                                </div>

                                {/* NEW: Tab navigation for multiple votes */}
                                {dialogData.allVotes && dialogData.allVotes.length > 1 && (
                                    <div className="vote-tabs">
                                        {dialogData.allVotes.map((vote, index) => (
                                            <div
                                                key={index}
                                                className={`vote-tab ${selectedVoteTab === index ? 'active' : ''}`}
                                                onClick={() => setSelectedVoteTab(index)}
                                            >
                                                Vote {index + 1}
                                                {index === 0 && ' (Most Recent)'}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* MODIFIED: Show details for selected vote */}
                                {(() => {
                                    const selectedVote = dialogData.allVotes && dialogData.allVotes[selectedVoteTab]
                                        ? dialogData.allVotes[selectedVoteTab]
                                        : dialogData.allVotes && dialogData.allVotes[0];

                                    if (!selectedVote) return null;

                                    const magnitude = selectedVote.magnitude;
                                    const rationale = selectedVote.rationale;
                                    let winner, loser, confidence;

                                    if (magnitude < 0) {
                                        winner = dialogData.leftEntity;
                                        loser = dialogData.rightEntity;
                                        confidence = Math.abs(magnitude);
                                    } else if (magnitude > 0) {
                                        winner = dialogData.rightEntity;
                                        loser = dialogData.leftEntity;
                                        confidence = magnitude;
                                    } else {
                                        winner = null;
                                        loser = null;
                                        confidence = 0;
                                    }

                                    return (
                                        <div>
                                            <hr style={{margin: '10px 0'}} />
                                            <p><em>Details from selected vote:</em></p>
                                            <p><strong>Raw Magnitude:</strong> {magnitude} (range: -50 to +50)</p>
                                            {winner ? (
                                                <p><strong>Winner:</strong> {winner} (confidence: {confidence}/50)</p>
                                            ) : (
                                                <p><strong>Result:</strong> Tie (neutral vote)</p>
                                            )}

                                            {rationale ? (
                                                <div style={{ marginBottom: '15px', marginTop: '15px' }}>
                                                    <p><strong>Rationale:</strong></p>
                                                    <div style={{
                                                        backgroundColor: '#f5f5f5',
                                                        padding: '10px',
                                                        borderRadius: '5px',
                                                        fontStyle: 'italic',
                                                        whiteSpace: 'pre-wrap'
                                                    }}>
                                                        {rationale}
                                                    </div>
                                                </div>
                                            ) : (
                                                <p style={{ fontStyle: 'italic', color: '#666', marginTop: '15px' }}>
                                                    No rationale provided for this vote.
                                                </p>
                                            )}
                                        </div>
                                    );
                                })()}

                                {/* NEW: Button container for actions */}
                                <div className="dialog-buttons">
                                    <button onClick={() => setDialogData(null)}>Close</button>
                                    <button
                                        className="add-vote-btn"
                                        onClick={handleAddVoteFromDialog}
                                        disabled={dialogData && votingCells.has(dialogData.cellKey)}
                                    >
                                        {dialogData && votingCells.has(dialogData.cellKey) ? 'Voting...' : 'Add Another Vote'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            return (
                <QueryClientProvider client={queryClient}>
                    <RankingApp />
                </QueryClientProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
