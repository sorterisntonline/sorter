# file: supervisord.conf

[supervisord]
nodaemon=true               ; Run in the foreground, which is perfect for dev
pidfile=./supervisor.pid    ; Keep state files local
logfile=./supervisord.log   ; Main log file

[unix_http_server]
file=./supervisor.sock      ; The socket file for supervisorctl to connect

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock ; How supervisorctl finds the server

; -------------------------------------------------------------------
;  Define your application processes below
; -------------------------------------------------------------------

[program:postgres]
command=bash -c "docker stop postgres-dev 2>/dev/null || true && docker run --rm --name postgres-dev -v %(here)s/pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD=password -e POSTGRES_USER=postgres -p 5432:5432 postgres:15"
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
stdout_logfile=./logs/postgres.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=./logs/postgres.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
redirect_stderr=true

[program:rust-server]
command=cargo run
directory=%(here)s/rustsorter/
autostart=true
autorestart=true
startretries=5
startsecs=10         ; Wait 10 seconds before assuming it started successfully
stdout_logfile=./logs/rust-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=./logs/rust-server.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
redirect_stderr=true

[program:vite-client]
command=npm run dev
directory=%(here)s/frontsorter/
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=./logs/vite-client.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=./logs/vite-client.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
redirect_stderr=true

[inet_http_server]
port=127.0.0.1:9001
