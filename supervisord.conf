# file: supervisord.conf

[supervisord]
nodaemon=true               ; Run in the foreground, which is perfect for dev
pidfile=./supervisor.pid    ; Keep state files local
logfile=./supervisord.log   ; Main log file

[unix_http_server]
file=./supervisor.sock      ; The socket file for supervisorctl to connect

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock ; How supervisorctl finds the server

; -------------------------------------------------------------------
;  Define your application processes below
; -------------------------------------------------------------------

[program:postgres]
command=bash -c "docker stop postgres-dev 2>/dev/null || true && docker run --rm --name postgres-dev --volume %(here)s/pgdata:/var/lib/postgresql/data --volume %(here)s/database/pg_hba.conf:/etc/postgresql/pg_hba.conf --volume %(here)s/database/postgresql.conf:/etc/postgresql/postgresql.conf -e POSTGRES_PASSWORD=password -e POSTGRES_USER=postgres -e PGDATA=/var/lib/postgresql/data -p 5438:5432 postgres:14.1 postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf"
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
stdout_logfile=./logs/postgres.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=./logs/postgres.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:rust-server]
command=cargo run
directory=%(here)s/rustsorter/
environment=RUST_LOG="debug",DATABASE_URL="postgres://postgres:password@localhost:5438/postgres?sslmode=disable"
autostart=true
autorestart=true
startretries=5
startsecs=10         ; Wait 10 seconds before assuming it started successfully
stdout_logfile=./logs/rust-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=./logs/rust-server.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:vite-client]
command=npm run dev
directory=%(here)s/frontsorter/
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=./logs/vite-client.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=./logs/vite-client.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Migrations are a one-off task, not a long-running process.
; We define it here so we can run it on demand.
[program:migrations]
command=./dbmate.sh up
autostart=false      ; Do NOT start this automatically
autorestart=false    ; Do NOT restart it if it finishes
startsecs=0
stdout_logfile=./logs/migrations.log
stderr_logfile=./logs/migrations.err
