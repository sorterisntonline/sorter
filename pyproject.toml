[project]
name = "sorter"
version = "0.1.0"
description = "Sorter - Rust and React based pair-wise democratic social media application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supervisord-mcp>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.23.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-dependency>=0.5.1",
    "uuid>=1.30",
]

[project.scripts]
sorter = "main:main"
