[project]
name = "sorter"
version = "0.1.0"
description = "Sorter - Rust and React based pair-wise democratic social media application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supervisord-mcp>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
sorter = "main:main"
