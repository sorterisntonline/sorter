app = 'sorter-fly-prod'
primary_region = 'ewr'

[build]
  dockerfile = 'docker/fly/Dockerfile'

[env]
  ENVIRONMENT = 'production'
  PORT = '8080'
  PGSSLMODE = 'require'
  AUTO_LOGIN = 'false'
  NO_RATE_LIMITS = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '180s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
