model: "openai/gpt-4o-mini"  # Model that supports tool calls
route: "fallback"              # OpenRouter routing strategy

headers:
  http_referer: "http://localhost:3000"
  title: "Music Tag Generator"

prompt:
  system_message: "You are a music tagging assistant that provides structured tag suggestions. Always return valid JSON matching the specified schema."
  user_template: |
    Given the user input: '{input}', suggest relevant music tags.

    For example, if the input is 'kendrick lamar', you might suggest:
    - #kendrick-lamar (artist)
    - #good-kid-maad-city (album)
    - #alright (track)
    - #hip-hop (genre)
    - #tde (label)

    Return a structured response following the schema provided.

schema:
  type: "object"
  properties:
    suggested_tags:
      type: "array"
      items:
        type: "string"
        pattern: "^#[a-z0-9-]+$"
      minItems: 1
      maxItems: 5
      description: "List of hashtags, lowercase with hyphens"
    
    tag_types:
      type: "array"
      items:
        type: "string"
        enum: ["artist", "album", "track", "genre", "decade", "label"]
      minItems: 1
      maxItems: 5
      description: "Types corresponding to each suggested tag"
    
    spotify_search:
      type: "string"
      minLength: 1
      description: "Optimized search term for Spotify API"
  
  required: ["suggested_tags", "tag_types", "spotify_search"]
  additionalProperties: false 